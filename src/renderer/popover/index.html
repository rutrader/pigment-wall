<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>Pigment Wall</title>
    <style>
      /* Vibrancy shows through, so the page paints no opaque background. */
      :root { color-scheme: light dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font: 12px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: canvastext;
        padding: 14px 14px 10px;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
      #today { image-rendering: pixelated; border-radius: 4px; }
      .headline { display: flex; flex-direction: column; gap: 3px; padding-top: 2px; }
      #today-when {
        font-size: 10px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.7px; opacity: 0.45;
      }
      #today-fill { font-size: 27px; font-weight: 600; letter-spacing: -0.5px; line-height: 1; }
      #today-fill.over { color: #e8973a; }
      #today-meta { opacity: 0.62; }
      #roast {
        font-size: 12px; line-height: 1.5; font-style: italic;
        opacity: 0.78; margin: -4px 0 14px;
        padding-left: 9px; border-left: 2px solid currentColor;
      }
      #roast[data-kind="dead"] { opacity: 0.5; }
      #wall { max-height: 322px; overflow-y: auto; overflow-x: hidden; }
      .week { display: flex; gap: 4px; margin-bottom: 4px; align-items: center; }
      .week.head { margin-bottom: 5px; }
      /* The Monday's date. Narrow on purpose — it is an axis, not a column. */
      .week-label {
        width: 20px; flex: none; text-align: right;
        font-size: 9px; font-variant-numeric: tabular-nums; opacity: 0.35;
      }
      .weekday {
        width: 46px; flex: none; text-align: center;
        font-size: 9px; font-weight: 600; letter-spacing: 0.5px; opacity: 0.3;
      }
      .tile { width: 46px; height: 46px; flex: none; border-radius: 3px; }
      .tile canvas { image-rendering: pixelated; border-radius: 3px; display: block; }
      .tile.idle canvas { opacity: 0.22; }
      /* A day outside the range still holds its column, or the grid skews. */
      .tile.empty { background: currentColor; opacity: 0.04; }
      .tile:not(.empty):hover { outline: 1.5px solid currentColor; outline-offset: 1px; }
      /* Today is in the grid because its column position is the point. Marked,
         so it is findable without counting across from the weekday header. */
      .tile.today { outline: 2px solid #e8973a; outline-offset: 1px; }
    </style>
  </head>
  <body>
    <header>
      <canvas id="today"></canvas>
      <div class="headline">
        <div id="today-when"></div>
        <div id="today-fill">—</div>
        <div id="today-meta">reading your history…</div>
      </div>
    </header>
    <div id="roast" hidden></div>
    <div id="wall"></div>
    <script src="main.js"></script>
  </body>
</html>
